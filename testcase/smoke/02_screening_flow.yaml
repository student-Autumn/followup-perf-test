# ============================================================
# 冒烟测试：筛查业务核心链路
# 流程：创建机构 → 创建项目 → 创建病人 → 创建筛查记录 → 查询验证 → 清理
# 目的：验证系统核心筛查业务流程（项目/病人/筛查记录）正常
# ============================================================

- feature: 冒烟-筛查业务流程
  story: 创建机构
  title: 步骤1-创建测试机构（项目前置条件）
  request:
    method: POST
    url: ${evn(base_url)}/organization/create
    json:
      orgName: "[AUTO]冒烟筛查机构_${timestamp()}"
      orgType: 1
      regionId: 1
      address: "杭州市西湖区筛查地址"
      contactPerson: "冒烟筛查联系人"
      contactInfo: ${random_phone()}
  extract:
    smk2_org_id: [json, "$.data", 0]
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 创建成功: ["json[success]", true]

- feature: 冒烟-筛查业务流程
  story: 创建项目
  title: 步骤2-创建筛查项目（关联机构）
  request:
    method: POST
    url: ${evn(base_url)}/project/create
    json:
      projectName: "[AUTO]冒烟筛查项目_${timestamp()}"
      projectStatus: 1
      screenDate: "2026-07-16"
      hospitalIds:
        - 18
      organizationId: ${read_extract(smk2_org_id)}
      regionId: 1
  extract:
    smk2_project_id: [json, "$.data", 0]
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 创建成功: ["json[success]", true]

- feature: 冒烟-筛查业务流程
  story: 创建病人
  title: 步骤3-创建筛查病人
  request:
    method: POST
    url: ${evn(base_url)}/patient/create
    json:
      name: "[AUTO]冒烟病人_${timestamp()}"
      age: 45
      gender: 1
      idNo: "${random_id_no(1)}"
      address: "杭州市西湖区"
      emergencyContact: "冒烟紧急联系人"
      emergencyPhone: "13800001111"
  extract:
    smk2_patient_id: [json, "$.data", 0]
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 创建成功: ["json[success]", true]

- feature: 冒烟-筛查业务流程
  story: 创建筛查记录
  title: 步骤4-为病人创建筛查记录（关联项目）
  request:
    method: POST
    url: ${evn(base_url)}/screen/record/create
    json:
      patientName: "[AUTO]冒烟筛查病人_${timestamp()}"
      idNo: "${random_id_no(1)}"
      gender: 1
      age: 45
      screenNo: "SC${timestamp()}"
      screenProject: "冒烟肠癌筛查"
      screenProjectId: ${read_extract(smk2_project_id)}
      screenDate: "2026-07-16"
      bindCardDate: "2026-07-16"
      bindCardNo: "CARD${timestamp()}"
  extract:
    smk2_screen_id: [json, "$.data", 0]
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 创建成功: ["json[success]", true]

- feature: 冒烟-筛查业务流程
  story: 查询筛查记录
  title: 步骤5-验证筛查记录可查到
  request:
    method: POST
    url: ${evn(base_url)}/screen/record/list
    json:
      pageNum: 1
      pageSize: 10
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 查询成功: ["json[success]", true]

- feature: 冒烟-筛查业务流程
  story: 清理-删除筛查记录
  title: 步骤6-删除测试筛查记录
  request:
    method: POST
    url: ${evn(base_url)}/screen/record/delete/${read_extract(smk2_screen_id)}
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 删除成功: ["json[success]", true]

- feature: 冒烟-筛查业务流程
  story: 清理-删除病人
  title: 步骤7-删除测试病人
  request:
    method: POST
    url: ${evn(base_url)}/patient/delete/${read_extract(smk2_patient_id)}
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 删除成功: ["json[success]", true]

- feature: 冒烟-筛查业务流程
  story: 清理-删除项目
  title: 步骤8-删除测试项目
  request:
    method: POST
    url: ${evn(base_url)}/project/delete/${read_extract(smk2_project_id)}
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 删除成功: ["json[success]", true]

- feature: 冒烟-筛查业务流程
  story: 清理-删除机构
  title: 步骤9-删除测试机构
  request:
    method: POST
    url: ${evn(base_url)}/organization/delete/${read_extract(smk2_org_id)}
  validate:
    eq:
      - 状态码200: [status_code, 200]
      - 删除成功: ["json[success]", true]
