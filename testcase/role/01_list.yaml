-
  feature: 角色管理
  story: 分页查询角色
  title: 分页查询角色-默认分页
  request:
    method: post
    url: ${evn(base_url)}/role/list
    json:
      pageNum: 1
      pageSize: 10
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 当前页码为1: ["json[data][current]", 1]
      - 每页大小为10: ["json[data][size]", 10]
-
  feature: 角色管理
  story: 分页查询角色
  title: 按角色名称模糊查询
  request:
    method: post
    url: ${evn(base_url)}/role/list
    json:
      pageNum: 1
      pageSize: 10
      roleName: "${read_extract(realRoleName)}"
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
