-
  feature: 病人管理
  story: 分页查询病人列表
  title: 分页查询病人列表-默认分页
  request:
    method: post
    url: ${evn(base_url)}/patient/list
    json:
      pageNum: 1
      pageSize: 10
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 当前页码为1: ["json[data][current]", 1]
      - 每页大小为10: ["json[data][size]", 10]
