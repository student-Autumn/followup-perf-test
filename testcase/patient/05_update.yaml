-
  feature: 病人管理
  story: 更新病人信息
  title: 更新病人信息成功
  request:
    method: post
    url: ${evn(base_url)}/patient/update
    json:
      patientId: ${read_extract(realPatientId)}
      name: "测试病人-已更新"
      age: 31
      gender: 1
      address: "更新后的地址"
      emergencyContact: "更新后紧急联系人"
      emergencyPhone: "13900139000"
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 更新返回true: ["json[data]", true]
