-
  feature: 用户管理
  story: 新增用户
  title: 新增用户成功
  request:
    method: post
    url: ${evn(base_url)}/user/create
    json:
      username: "测试用户-压测"
      loginAccount: "${random_phone()}"
      phone: "${random_phone()}"
      orgId: ${read_extract(realOrgId)}
      status: 0
      roleIds:
        - ${read_extract(realRoleId)}
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 创建返回true: ["json[data]", true]
