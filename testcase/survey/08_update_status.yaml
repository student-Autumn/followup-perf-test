-
  feature: 调查问卷管理
  story: 更新问卷状态
  title: 启用问卷成功
  request:
    method: post
    url: ${evn(base_url)}/survey/update/status
    params:
      id: ${read_extract(surveyId)}
      status: 1
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 更新返回true: ["json[data]", true]
-
  feature: 调查问卷管理
  story: 更新问卷状态
  title: 禁用问卷成功
  request:
    method: post
    url: ${evn(base_url)}/survey/update/status
    params:
      id: ${read_extract(surveyId)}
      status: 0
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 更新返回true: ["json[data]", true]
