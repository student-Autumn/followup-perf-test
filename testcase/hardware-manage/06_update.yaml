-
  feature: 硬件管理
  story: 更新硬件管理记录
  title: 更新硬件管理记录成功
  request:
    method: post
    url: ${evn(base_url)}/hardware-manage/update
    json:
      id: ${read_extract(realHardwareManageId)}
      hardwareNo: "${read_extract(realHardwareNo)}"
      hardwareType: 1
      organizationId: ${read_extract(realOrgId)}
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 更新返回true: ["json[data]", true]
