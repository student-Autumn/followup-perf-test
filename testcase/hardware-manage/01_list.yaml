-
  feature: 硬件管理
  story: 分页查询硬件管理列表
  title: 分页查询硬件管理-默认分页
  request:
    method: post
    url: ${evn(base_url)}/hardware-manage/list
    json:
      pageNum: 1
      pageSize: 10
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 当前页码为1: ["json[data][current]", 1]
      - 每页大小为10: ["json[data][size]", 10]
-
  feature: 硬件管理
  story: 分页查询硬件管理列表
  title: 按硬件类型筛选查询
  request:
    method: post
    url: ${evn(base_url)}/hardware-manage/list
    json:
      pageNum: 1
      pageSize: 10
      hardwareType: 1
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
-
  feature: 硬件管理
  story: 分页查询硬件管理列表
  title: 按硬件编号模糊查询
  request:
    method: post
    url: ${evn(base_url)}/hardware-manage/list
    json:
      pageNum: 1
      pageSize: 10
      hardwareNo: "${read_extract(realHardwareNo)}"
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
