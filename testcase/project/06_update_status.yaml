-
  feature: 项目管理
  story: 更新项目状态
  title: 启用项目成功
  request:
    method: post
    url: ${evn(base_url)}/project/update/status
    params:
      id: ${read_extract(projectId)}
      status: 1
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 更新返回true: ["json[data]", true]
-
  feature: 项目管理
  story: 更新项目状态
  title: 停用项目成功
  request:
    method: post
    url: ${evn(base_url)}/project/update/status
    params:
      id: ${read_extract(projectId)}
      status: 0
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 更新返回true: ["json[data]", true]
