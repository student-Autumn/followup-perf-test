-
  feature: 项目管理
  story: 更新项目
  title: 更新项目信息成功
  request:
    method: post
    url: ${evn(base_url)}/project/update
    json:
      id: ${read_extract(projectId)}
      projectName: "测试项目-已更新"
      projectStatus: 0
      screenDate: "2026-06-24"
      hospitalIds: ${read_extract(realHospitalIds)}
      organizationId: ${read_extract(realProjectOrgId)}
      regionId: ${read_extract(realRegionId)}
  validate:
    eq:
      - 状态码为200: [status_code, 200]
      - 响应成功: ["json[success]", true]
      - 更新返回true: ["json[data]", true]
